# XcodeGen-проект NutriMate (на раннере: brew install xcodegen && xcodegen generate)
name: NutriMate
options:
  bundleIdPrefix: kz.innotech.nutrimate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "17"
    CURRENT_PROJECT_VERSION: "17"
targets:
  NutriMate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NutriMate
    info:
      path: NutriMate/Info.plist
      properties:
        CFBundleDisplayName: NutriMate
        CFBundleShortVersionString: "17"
        CFBundleVersion: "17"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # ProMotion: разрешаем 120 Гц на iPhone 13 Pro Max и новее
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.innotech.nutrimate.app
        PRODUCT_NAME: NutriMate
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  NutriMate:
    build:
      targets:
        NutriMate: all
    run:
      config: Debug
    archive:
      config: Release
