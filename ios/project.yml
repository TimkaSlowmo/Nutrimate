# XcodeGen-проект NutriMate (на раннере: brew install xcodegen && xcodegen generate)
name: NutriMate
options:
  bundleIdPrefix: kz.innotech.nutrimate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "33"
    CURRENT_PROJECT_VERSION: "33"
targets:
  NutriMate:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NutriMate
    info:
      path: NutriMate/Info.plist
      properties:
        CFBundleDisplayName: NutriMate
        CFBundleShortVersionString: "33"
        CFBundleVersion: "33"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Камера (v30 чек, v33 и сами продукты): распознаётся на телефоне; если не уверен и включён Умный Нутрик —
        # уменьшенная копия без геометки уходит на наш сервер только для распознавания и не хранится
        NSCameraUsageDescription: "NutriMate recognizes your groceries or receipt to add products to your fridge. Photos are processed on your phone; with Smart Nutrik on, a small copy may be checked online and is never stored. / NutriMate распознаёт продукты или чек, чтобы добавить их в холодильник. Фото обрабатывается на телефоне; с Умным Нутриком уменьшенная копия может быть проверена онлайн и не хранится."
        # ProMotion: разрешаем 120 Гц на iPhone 13 Pro Max и новее
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.innotech.nutrimate.app
        PRODUCT_NAME: NutriMate
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        CODE_SIGNING_ALLOWED: NO
  # Юнит-тесты (v33): сопоставление «метка Vision / имя от сервера → продукт базы», решение «чек или продукты»
  NutriMateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NutriMateTests
    dependencies:
      - target: NutriMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kz.innotech.nutrimate.tests
        CODE_SIGNING_ALLOWED: NO
schemes:
  NutriMate:
    build:
      targets:
        NutriMate: all
    test:
      config: Debug
      targets:
        - NutriMateTests
    run:
      config: Debug
    archive:
      config: Release
