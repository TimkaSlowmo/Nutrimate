name: nutrimate
description: NutriMate Pro - calories, fridge, recipes and less food waste.
publish_to: 'none'
version: 37.0.0+37

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.2
  image_picker: ^1.1.2
  image: ^4.2.0

flutter:
  uses-material-design: true
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSerif4-It.ttf
          style: italic
  assets:
    - assets/icons/e/
    - assets/icons/p/
    - assets/icons/s/
