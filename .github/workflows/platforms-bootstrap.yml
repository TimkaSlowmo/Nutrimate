name: Platforms bootstrap (one-time)

# Одноразово: генерирует android/ windows/ macos/ linux/ тем же Flutter, что и deploy.yml,
# и кладёт их в ветку platforms-bootstrap (дальше их правят и коммитят в main вручную).
on:
  push:
    branches: [main]
    paths: ['.github/workflows/platforms-bootstrap.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: flutter create
        run: |
          flutter --version | tee /tmp/flutter-version.txt
          mkdir -p /tmp/gen && cd /tmp/gen
          flutter create --platforms=android,windows,macos,linux --org kz.innotech --project-name nutrimate nutrimate
          cd nutrimate
          cp /tmp/flutter-version.txt FLUTTER_VERSION.txt
          git init -q -b platforms-bootstrap
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add android windows macos linux .metadata FLUTTER_VERSION.txt pubspec.yaml .gitignore
          git commit -qm "flutter create output"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" platforms-bootstrap
