name: iOS screenshots (simulator)

# Собирает приложение для симулятора, запускает его на iPhone (iOS 18) с демо-данными
# и делает скриншоты всех экранов + короткое видео. Результат — artifact «screens»
# (ночной агент скачивает его и смотрит картинки, чтобы видеть приложение глазами).
on:
  push:
    branches: [main]
    paths: ['ios/**', '!ios/*.md', '.github/workflows/ios-screens.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-screens
  cancel-in-progress: true

jobs:
  screens:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild -project NutriMate.xcodeproj -scheme NutriMate -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:|fatal" build.log | sort -u | head -80; tail -40 build.log; exit 1; }

      - name: Boot simulator
        run: |
          xcrun simctl list runtimes
          # самый похожий на iPhone 13 Pro Max (6.7") из доступных, на iOS 18
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS' and x['version'].startswith('18')]; print(sorted(r,key=lambda x:[int(p) for p in x['version'].split('.')])[-1]['identifier'] if r else '')")
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS']; print(r[-1]['identifier'])")
          fi
          echo "Runtime: $RUNTIME"
          for M in "iPhone 16 Pro Max" "iPhone 15 Pro Max" "iPhone 16 Plus" "iPhone 16 Pro" "iPhone 16"; do
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; t=[x['identifier'] for x in json.load(sys.stdin)['devicetypes'] if x['name']=='$M']; print(t[0] if t else '')")
            if [ -n "$TYPE" ]; then UDID=$(xcrun simctl create shots "$TYPE" "$RUNTIME") && break; fi
          done
          echo "Device: $M $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/NutriMate.app

      - name: Take screenshots
        run: |
          mkdir -p screens
          BID=kz.innotech.nutrimate.app
          shot() { # имя, ожидание, аргументы
            NAME=$1; WAIT=$2; shift 2
            xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
            xcrun simctl launch "$UDID" $BID -uiShot "$@"
            sleep "$WAIT"
            xcrun simctl io "$UDID" screenshot --type=png "screens/$NAME.png"
            echo "📸 $NAME"
          }
          shot 00-onboarding 10 -onboarding
          shot 01-home 6 -tab home
          shot 02-fridge 5 -tab fridge
          shot 03-search 5 -tab search
          shot 04-recipes 5 -tab recipes
          shot 05-profile 5 -tab profile
          shot 06-body 6 -sheet body
          shot 07-chat 5 -sheet chat
          shot 08-eco 5 -sheet eco
          shot 09-diary 5 -sheet diary
          shot 10-shopping 5 -sheet shopping
          shot 11-tutorial 6 -tutorial
          shot 12-week 6 -sheet week
          shot 13-onboarding-goal 6 -onboarding -obStep 4
          shot 14-profile-bottom 6 -tab profile -scrollBottom
          shot 15-edit-profile 6 -tab profile -push edit
          shot 16-medals 6 -tab profile -push medals
          shot 17-onboarding-hello 6 -onboarding -obStep 1
          shot 18-recipe 6 -sheet recipe
          # три языка: ключевые экраны по-русски и по-казахски (ищем обрезанный текст)
          for LG in ru kk; do
            shot $LG-00-onboarding 7 -onboarding -lang $LG
            shot $LG-01-home 6 -tab home -lang $LG
            shot $LG-02-fridge 5 -tab fridge -lang $LG
            shot $LG-03-search 5 -tab search -lang $LG
            shot $LG-04-recipes 5 -tab recipes -lang $LG
            shot $LG-05-profile 5 -tab profile -lang $LG
            shot $LG-06-body 6 -sheet body -lang $LG
            shot $LG-07-chat 5 -sheet chat -lang $LG
            shot $LG-08-eco 5 -sheet eco -lang $LG
            shot $LG-12-week 6 -sheet week -lang $LG
            shot $LG-13-onboarding-goal 6 -onboarding -obStep 4 -lang $LG
            shot $LG-14-profile-bottom 6 -tab profile -scrollBottom -lang $LG
            shot $LG-15-edit-profile 6 -tab profile -push edit -lang $LG
            shot $LG-11-tutorial 6 -tutorial -lang $LG
            shot $LG-18-recipe 6 -sheet recipe -lang $LG
          done
          # тёмная тема (Profile → Appearance): ищем нечитаемый текст и светлые пятна
          shot dark-00-onboarding 7 -onboarding -dark
          shot dark-01-home 6 -tab home -dark
          shot dark-02-fridge 5 -tab fridge -dark
          shot dark-03-search 5 -tab search -dark
          shot dark-04-recipes 5 -tab recipes -dark
          shot dark-05-profile 5 -tab profile -dark
          shot dark-14-profile-bottom 6 -tab profile -scrollBottom -dark
          shot dark-06-body 6 -sheet body -dark
          shot dark-07-chat 5 -sheet chat -dark
          shot dark-08-eco 5 -sheet eco -dark
          shot dark-10-shopping 5 -sheet shopping -dark
          shot dark-11-tutorial 6 -tutorial -dark
          shot dark-12-week 6 -sheet week -dark
          shot dark-15-edit-profile 6 -tab profile -push edit -dark
          shot dark-18-recipe 6 -sheet recipe -dark
          shot dark-ru-01-home 6 -tab home -dark -lang ru
          # замер плавности: приложение само прокручивает экран 6 с и пишет fps в Documents/fps.txt
          : > screens/fps.txt
          for T in home fridge search recipes; do
            xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
            xcrun simctl launch "$UDID" $BID -uiShot -fps -tab $T
            sleep 11
            C=$(xcrun simctl get_app_container "$UDID" $BID data)
            cat "$C/Documents/fps.txt" >> screens/fps.txt 2>/dev/null || echo "$T no-data" >> screens/fps.txt
            rm -f "$C/Documents/fps.txt"
          done
          # поиск дорогой части Home: то же самое с отключённым Нутриком / фоном / тенями
          for OFF in nutrik nopause sync nopause,sync; do
            xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
            xcrun simctl launch "$UDID" $BID -uiShot -fps -tab home -perfOff $OFF
            sleep 11
            C=$(xcrun simctl get_app_container "$UDID" $BID data)
            echo "home(-$OFF) $(cat "$C/Documents/fps.txt" 2>/dev/null || echo no-data)" >> screens/fps.txt
            rm -f "$C/Documents/fps.txt"
          done
          echo "FPS:"; cat screens/fps.txt
          # короткое видео: Home и анимации Нутрика
          xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force screens/home.mp4 &
          REC=$!
          sleep 1
          xcrun simctl launch "$UDID" $BID -uiShot -sheet body
          sleep 7
          kill -INT $REC; wait $REC || true
          ls -la screens
          # проверка на падение: приложение должно быть живо
          xcrun simctl spawn "$UDID" launchctl list | grep -q "$BID" && echo "App is running ✅" || echo "::warning::App is not running — possible crash"

      - name: Crash logs
        if: always()
        run: |
          mkdir -p screens/crash
          find ~/Library/Logs/DiagnosticReports -name "NutriMate*" -newer ios/project.yml -exec cp {} screens/crash/ \; 2>/dev/null || true
          ls screens/crash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens
          retention-days: 14

      - name: Publish to branch ios-screens (для агента и владельца)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          cd screens
          cat > README.md <<MD
          # NutriMate — скриншоты из симулятора
          Сборка: ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC'). Устройство: iPhone 16 Pro Max (iOS 18), демо-данные.

          ## Плавность (автопрокрутка 6 с, симулятор — максимум 60 fps, без GPU-ускорения раннера; на iPhone будет выше)
          \`\`\`
          $(cat fps.txt 2>/dev/null)
          \`\`\`
          MD
          for f in *.png; do echo "### ${f%.png}" >> README.md; echo "<img src=\"$f\" width=\"300\">" >> README.md; echo >> README.md; done
          git init -q -b ios-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "screens for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-screens
