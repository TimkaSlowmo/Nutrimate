name: iOS build (unsigned IPA)

on:
  push:
    branches: [main]
    paths: ['ios/**', '!ios/*.md', '.github/workflows/ios.yml', 'tool/vision_labels.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no signing)
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -project NutriMate.xcodeproj -scheme NutriMate -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || {
              echo "::group::Compiler errors"; grep -E "error:|fatal" build.log | sort -u | head -80; echo "::endgroup::"
              tail -60 build.log
              exit 1
            }
          grep -c "warning:" build.log || true

      - name: Package NutriMate.ipa
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/NutriMate.app
          test -d "$APP"
          rm -rf Payload NutriMate.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NutriMate.ipa Payload
          ls -lh NutriMate.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NutriMate-ipa
          path: ios/NutriMate.ipa

      - name: Publish release ios-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios
        run: |
          V=$(cat VERSION)
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest NutriMate.ipa --target "$GITHUB_SHA" --latest=false \
            --title "NutriMate iOS v$V" \
            --notes "Unsigned build v$V ($(date -u +%Y-%m-%d)). Download NutriMate.ipa → Sideloadly (or AltStore) with your Apple ID → iPhone via cable. Installing on top keeps your data."

      # Копия в общий релиз `latest` (там же APK / Windows / macOS / Linux — см. apps.yml и README)
      - name: Copy NutriMate.ipa into release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --latest --title "NutriMate — all platforms" \
              --notes "Downloads for Android, Windows, macOS, Linux and iPhone — see README: https://github.com/${GITHUB_REPOSITORY}#readme"
          fi
          gh release upload latest NutriMate.ipa --clobber

  # Юнит-тесты (v33) на симуляторе: «метка Vision / имя от сервера → продукт базы», «чек или продукты».
  # Отдельная задача: релиз ios-latest от неё не зависит.
  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check Vision label dictionary
        run: python3 tool/vision_labels.py --check

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Unit tests (simulator)
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [(k, x) for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          c.sort(key=lambda kx: [int(p) for p in kx[0].split('iOS-')[-1].split('-') if p.isdigit()])
          print(c[-1][1]['udid'] if c else '')")
          echo "Simulator: $UDID"
          xcodebuild test -project NutriMate.xcodeproj -scheme NutriMate -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || {
              echo "::group::Failures"; grep -E "error:|failed|XCTAssert|fatal" test.log | sort -u | head -80; echo "::endgroup::"
              tail -60 test.log
              exit 1
            }
          grep -E "Test Case .*(passed|failed)|Executed" test.log | tail -20
