name: Apps (Android, Windows, macOS, Linux)

# Собирает NutriMate для Android / Windows / macOS / Linux тем же Flutter (stable), что и сайт (deploy.yml),
# проверяет запуск (эмулятор Android, Xvfb на Linux, запуск .exe / .app) и публикует всё в релиз `latest`:
#   https://github.com/<repo>/releases/latest/download/NutriMate-android.apk  (…-windows.zip, …-macos.zip, …-linux.tar.gz, NutriMate.ipa)
# Сломанная платформа не мешает остальным: релиз получает то, что собралось (и прошло проверку).
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'windows/**'
      - 'macos/**'
      - 'linux/**'
      - 'tool/ci/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: write

# Не отменяем идущую сборку (иначе частые пуши не дают дойти до релиза): новая ждёт, промежуточные схлопываются.
concurrency:
  group: apps
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Release keystore from secrets (if the owner added them)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key from repository secrets"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — signing with the fixed debug key android/app/nutrimate-debug.keystore (see README → Android signing)"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk NutriMate-android.apk
          ls -lh NutriMate-android.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs NutriMate-android.apk | grep -E "SHA-256|DN" || true
          unzip -l NutriMate-android.apk | grep -E "lib/.*libapp.so"
      - uses: actions/upload-artifact@v4
        with:
          name: NutriMate-android
          path: NutriMate-android.apk
          retention-days: 7

  android-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NutriMate-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (API 34) — install, launch, screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tool/ci/android_smoke.sh NutriMate-android.apk shots/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: |
            shots
            logs
          retention-days: 7
      - name: Screenshots → branch ios-screens (folder android/)
        if: always() && github.ref == 'refs/heads/main' && hashFiles('shots/android/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci/push_screens.sh shots/android android "Android emulator (API 34, Pixel 6)"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xdotool imagemagick libgl1-mesa-dri
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux bundle
        run: |
          flutter build linux --release
          rm -rf NutriMate && cp -r build/linux/x64/release/bundle NutriMate
          ls -la NutriMate
          tar -czf NutriMate-linux.tar.gz NutriMate
          ls -lh NutriMate-linux.tar.gz
      - name: Smoke test under Xvfb (+ screenshots)
        run: xvfb-run -a -s "-screen 0 1440x960x24" bash tool/ci/linux_smoke.sh NutriMate shots/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: NutriMate-linux
          path: NutriMate-linux.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screens
          path: |
            shots
            logs
          retention-days: 7
      - name: Screenshots → branch ios-screens (folder desktop/)
        if: github.ref == 'refs/heads/main' && hashFiles('shots/desktop/*.png') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci/push_screens.sh shots/desktop desktop "Desktop (Linux, Xvfb)"

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package NutriMate-windows.zip
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          if (!(Test-Path "$rel\NutriMate.exe")) { Get-ChildItem $rel; throw "NutriMate.exe not found" }
          if (Test-Path NutriMate) { Remove-Item -Recurse -Force NutriMate }
          Copy-Item -Recurse $rel NutriMate
          Compress-Archive -Path NutriMate -DestinationPath NutriMate-windows.zip -Force
          Get-Item NutriMate-windows.zip | Select-Object Name, Length
      - name: Smoke test (start NutriMate.exe, alive after 12 s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "NutriMate\NutriMate.exe" -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) { throw "NutriMate.exe exited early with code $($p.ExitCode)" }
          Write-Host "NutriMate.exe is running (pid $($p.Id)), window: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NutriMate-windows
          path: NutriMate-windows.zip
          retention-days: 7

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS (universal)
        run: flutter build macos --release
      - name: Package NutriMate-macos.zip
        run: |
          APP=build/macos/Build/Products/Release/NutriMate.app
          test -d "$APP"
          lipo -archs "$APP/Contents/MacOS/NutriMate"
          codesign -dv "$APP" 2>&1 | head -5 || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" NutriMate-macos.zip
          ls -lh NutriMate-macos.zip
      - name: Smoke test (start NutriMate.app, alive after 12 s)
        run: |
          APP=build/macos/Build/Products/Release/NutriMate.app
          "$APP/Contents/MacOS/NutriMate" > macos-run.log 2>&1 &
          PID=$!
          sleep 12
          if kill -0 $PID 2>/dev/null; then echo "NutriMate.app is running (pid $PID)"; kill $PID; else echo "::error::NutriMate.app exited early"; cat macos-run.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: NutriMate-macos
          path: NutriMate-macos.zip
          retention-days: 7

  release:
    needs: [android, android-test, linux, windows, macos]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect what was built
        run: |
          mkdir -p dist
          dl() { gh run download "$GITHUB_RUN_ID" -n "$1" -D dist || echo "::warning::$1 not available"; }
          # APK — только если прошёл проверку на эмуляторе (иначе в релизе остаётся прошлый рабочий)
          if [ "${{ needs.android-test.result }}" = "success" ]; then dl NutriMate-android; else echo "::warning::Android test did not pass — keeping the previous APK"; fi
          [ "${{ needs.linux.result }}" = "success" ] && dl NutriMate-linux
          [ "${{ needs.windows.result }}" = "success" ] && dl NutriMate-windows
          [ "${{ needs.macos.result }}" = "success" ] && dl NutriMate-macos
          gh release download ios-latest -p NutriMate.ipa -D dist || echo "::warning::no NutriMate.ipa in ios-latest"
          ls -la dist
      - name: Publish to release `latest`
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+).*/\1/')
          NOTES=$(cat <<EOF
          NutriMate v$V — download for your device (built $(date -u +%Y-%m-%d) from ${GITHUB_SHA::7}).

          | Device | File |
          |---|---|
          | Android 7+ | NutriMate-android.apk |
          | Windows 10/11 | NutriMate-windows.zip → unzip → NutriMate.exe |
          | macOS 12+ (Apple Silicon & Intel) | NutriMate-macos.zip → NutriMate.app |
          | Linux x64 | NutriMate-linux.tar.gz → NutriMate/NutriMate |
          | iPhone (iOS 17+) | NutriMate.ipa → Sideloadly |

          Install steps (EN/RU): see README — https://github.com/${GITHUB_REPOSITORY}#readme
          Web version: https://timkaslowmo.github.io/Nutrimate/
          EOF
          )
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "NutriMate v$V — all platforms" --notes "$NOTES" --latest
          fi
          # тег latest — на текущий коммит
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null || echo "::warning::could not move tag latest"
          shopt -s nullglob
          FILES=(dist/*)
          if [ ${#FILES[@]} -gt 0 ]; then gh release upload latest "${FILES[@]}" --clobber; fi
          gh release edit latest --title "NutriMate v$V — all platforms" --notes "$NOTES" --latest
          gh release view latest --json assets --jq '.assets[] | "\(.name)  \(.size)  \(.updatedAt)"'
